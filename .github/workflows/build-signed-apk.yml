name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > programas-release.jks
            printf "storeFile=programas-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              "${{ secrets.ANDROID_KEY_ALIAS }}" \
              "${{ secrets.ANDROID_KEY_PASSWORD }}" > keystore.properties
          else
            # Génère automatiquement une clé de signature dédiée si aucun secret n'est configuré
            keytool -genkeypair -noprompt \
              -keystore programas-release.jks \
              -alias programas \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "ProgramasUPGC2026!" \
              -keypass "ProgramasUPGC2026!" \
              -dname "CN=Programas, OU=UPGC, O=CROU Korhogo, L=Korhogo, C=CI"
            printf "storeFile=programas-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "ProgramasUPGC2026!" "programas" "ProgramasUPGC2026!" > keystore.properties
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          cp "$APK_PATH" programas-android-signed.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: programas-android-signed-apk
          path: programas-android-signed.apk
